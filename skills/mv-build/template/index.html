<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>메타버스</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- mv-deploy 단계에서 og 태그·파비콘을 채움 -->
  <style>
    :root { --primary: #00A84D; --accent: #ffd34d; --glass: rgba(14,18,22,.68); --line: rgba(255,255,255,.1);
      --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; overflow: hidden; background: #000; color: #fff; font-family: var(--font); -webkit-user-select: none; user-select: none; touch-action: none; }
    #app canvas { display: block; }
    .glass { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); }
    #card { position: fixed; left: 12px; top: calc(12px + var(--st)); padding: 12px 16px; border-radius: 18px; min-width: 200px; }
    #title { font-size: 12px; font-weight: 800; color: var(--accent); }
    #zone { font-size: 22px; font-weight: 900; margin-top: 2px; }
    #zone-sub { font-size: 12px; opacity: .7; margin-top: 2px; }
    #peers { font-size: 12px; margin-top: 6px; opacity: .85; }
    #dock { position: fixed; right: 12px; top: calc(12px + var(--st)); display: flex; gap: 6px; padding: 6px; border-radius: 16px; }
    #dock button { border: none; background: rgba(255,255,255,.08); color: #fff; width: 42px; height: 42px; border-radius: 12px; font-size: 20px; cursor: pointer; }
    #dock button:active { transform: scale(.94); }
    #joy { position: fixed; left: 24px; bottom: calc(24px + var(--sb)); width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.12); display: none; touch-action: none; }
    #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.8); }
    @media (pointer: coarse) { #joy { display: block; } }
    #toast { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); padding: 10px 18px; border-radius: 30px; background: rgba(0,0,0,.7); font-weight: 800; opacity: 0; transition: .2s; pointer-events: none; z-index: 30; }
    #toast.on { opacity: 1; }
    #fade { position: fixed; inset: 0; background: var(--primary); opacity: 0; transition: opacity .35s; pointer-events: none; z-index: 20; }
    #fade.on { opacity: 1; }
    #help { position: fixed; left: 50%; bottom: calc(14px + var(--sb)); transform: translateX(-50%); font-size: 12px; opacity: .6; text-align: center; pointer-events: none; }
    @media (pointer: coarse) { #help { display: none; } }
    #loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0b0f12; transition: opacity .5s; }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader .bar { width: 220px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); margin-top: 14px; overflow: hidden; }
    #loader .bar i { display: block; height: 100%; width: 10%; background: var(--primary); transition: width .3s; }
  </style>
</head>
<body>
  <div id="loader"><div style="text-align:center"><div style="font-size:42px">🌏</div><div id="ld-text" style="margin-top:8px;font-weight:800">불러오는 중</div><div class="bar"><i id="ld-bar"></i></div></div></div>
  <script>
    window.loader = {
      set(p, t) { const b = document.getElementById('ld-bar'); if (b) b.style.width = Math.round(p * 100) + '%'; if (t) document.getElementById('ld-text').textContent = t; },
      done() { const l = document.getElementById('loader'); if (!l) return; this.set(1); l.classList.add('done'); setTimeout(() => l.remove(), 600); },
    };
  </script>
  <div id="app"></div>
  <div id="card" class="glass"><div id="title"></div><div id="zone"></div><div id="zone-sub"></div><div id="peers">👥 혼자</div></div>
  <div id="dock" class="glass">
    <button data-emote="wave" title="손 흔들기">👋</button>
    <button data-emote="heart" title="하트">❤️</button>
    <button data-emote="party" title="축하">🎉</button>
    <button id="btn-name" title="닉네임">✏️</button>
  </div>
  <div id="joy"><div id="knob"></div></div>
  <div id="help">WASD · Shift 달리기 · Space 점프 · 드래그로 시점 · 바닥 클릭으로 이동 · 빛나는 문으로 들어가면 다른 곳</div>
  <div id="toast"></div>
  <div id="fade"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
