<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛠️ 구조물 작업대</title>
  <!-- 개발 전용 (npm run dev → /lab.html). 배포 빌드에는 안 들어감.
       구조물 하나를 정면·45°·옆·위에서 동시에 + 사람 크기 비교 + 참고 사진을 한 화면에.
       ?zone=<구역 id>&i=<소품 번호>   world.json 의 그 소품 그대로
       ?kind=gate&p={"text":"光化門"}   종류만 골라서 (p 는 추가 필드 JSON)
       ?avatar=<스타일>&color=%23ffd1dc&acc=head:cap   캐릭터 (src/avatars/*.js 포함)
       &ref=/ref/사진.jpg               public/ref/ 에 둔 참고 사진을 옆에
       props.js 를 고치면 저절로 새로고침됨 -->
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: #14181d; color: #fff; font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif; overflow: hidden; }
    #grid { position: fixed; inset: 40px 0 0 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; }
    #grid.ref { grid-template-columns: 1fr 1fr 1fr; }
    .cell { position: relative; background: #1d232a; overflow: hidden; }
    .cell span { position: absolute; left: 8px; top: 6px; font-size: 12px; font-weight: 800; background: rgba(0,0,0,.5); padding: 2px 8px; border-radius: 10px; z-index: 2; }
    .cell img { width: 100%; height: 100%; object-fit: contain; }
    #refcell { grid-row: 1 / 3; grid-column: 3; display: none; }
    #grid.ref #refcell { display: block; }
    #bar { position: fixed; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 13px; background: #0d1014; }
    #bar b { color: #ffd34d; }
    canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  </style>
</head>
<body>
  <div id="bar"><b>🛠️ 구조물 작업대</b><span id="info">불러오는 중…</span></div>
  <div id="grid">
    <div class="cell" data-view="front"><span>정면</span></div>
    <div class="cell" data-view="three"><span>45°</span></div>
    <div class="cell" id="refcell"><span>참고 사진</span><img id="refimg" alt="" /></div>
    <div class="cell" data-view="side"><span>옆</span></div>
    <div class="cell" data-view="top"><span>위</span></div>
  </div>
  <script type="module" src="/src/lab.js"></script>
</body>
</html>
