<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>컨셉 시안</title>
<!--
  메타버스 월드 컨셉 시안 (파일 하나로 열림, 인터넷 연결 필요: three.js CDN)
  아래 <script id="concept"> 와 <script id="zone"> 의 JSON 만 바꾸면 다른 시안이 됨.
  concept 값은 그대로 프로젝트의 src/concept.json 이 되고, zone 은 world.json 의 첫 구역 미리보기.
-->
<script id="concept" type="application/json">
{
  "id": "C",
  "name": "네온 야시장",
  "mood": "북적이고 반짝이는 도시의 밤",
  "keywords": [
    "네온",
    "사이버",
    "야시장"
  ],
  "palette": {
    "primary": "#ff2e88",
    "accent": "#00e5ff",
    "floor": "#2a2f3a",
    "wall": "#1b1f2a",
    "sky": [
      "#0b0326",
      "#3a0f5c"
    ],
    "fog": "#2a0c45"
  },
  "light": {
    "sky": "#b28cff",
    "ground": "#1a1030",
    "ambient": 1.1,
    "sun": "#ff9ad1",
    "intensity": 0.7
  },
  "props": {
    "leaf": "#2ee6a6",
    "trunk": "#3b2f4a",
    "wood": "#5b4b7a",
    "light": "#ff4fd8",
    "water": "#00e5ff"
  },
  "avatar": {
    "me": "#f3f0ff"
  }
}
</script>
<script id="zone" type="application/json">
{
  "name": "중앙 광장", "size": [30, 30],
  "props": [
    { "kind": "fountain", "x": 0, "z": 0 }, { "kind": "tree", "x": -9, "z": -8 }, { "kind": "tree", "x": 9, "z": -9 }, { "kind": "tree", "x": -10, "z": 8 },
    { "kind": "bench", "x": -4, "z": 5, "rot": 30 }, { "kind": "bench", "x": 4, "z": 5, "rot": -30 }, { "kind": "lamp", "x": -4, "z": -3 }, { "kind": "lamp", "x": 4, "z": -3 },
    { "kind": "flowers", "x": -7, "z": 1 }, { "kind": "flowers", "x": 7, "z": 1 }, { "kind": "kiosk", "x": 10, "z": 2, "rot": -90 }
  ],
  "portals": [ { "x": 0, "z": -14, "label": "다음 구역" } ]
}
</script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #0d1014; color: #fff; height: 100vh; display: grid; grid-template-columns: 1fr 340px; }
  @media (max-width: 820px) { body { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; } }
  #view { position: relative; min-height: 320px; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; left: 14px; top: 14px; padding: 10px 14px; border-radius: 16px; background: rgba(14,18,22,.62); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.1); }
  #hud .t { font-size: 11px; font-weight: 800; } #hud .z { font-size: 19px; font-weight: 900; }
  aside { padding: 22px; overflow: auto; border-left: 1px solid rgba(255,255,255,.08); }
  .tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 20px; margin: 0 4px 4px 0; background: rgba(255,255,255,.08); }
  h1 { font-size: 26px; margin-top: 6px; } .mood { opacity: .7; margin-top: 4px; }
  .sw { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
  .sw div { border-radius: 12px; padding: 34px 8px 8px; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .ui { margin-top: 18px; padding: 14px; border-radius: 16px; background: rgba(255,255,255,.04); }
  .btn { display: inline-block; padding: 10px 16px; border-radius: 12px; font-weight: 800; margin-top: 8px; color: #fff; }
  .pick { margin-top: 20px; font-size: 13px; opacity: .75; line-height: 1.6; }
  code { background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 6px; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
<div id="view"><div id="hud"><div class="t" id="h-t"></div><div class="z" id="h-z"></div></div></div>
<aside id="side"></aside>
<script type="module">
import * as THREE from 'three';
const K = JSON.parse(document.getElementById('concept').textContent);
const Z = JSON.parse(document.getElementById('zone').textContent);
const P = K.palette, C = (h) => new THREE.Color(h);
document.title = `시안 ${K.id} · ${K.name}`;
// ---- 오른쪽 설명 카드 ----
document.getElementById('h-t').textContent = `시안 ${K.id}`; document.getElementById('h-t').style.color = P.accent;
document.getElementById('h-z').textContent = Z.name;
const sw = [['primary', P.primary], ['accent', P.accent], ['floor', P.floor], ['wall', P.wall], ['sky ↑', P.sky[0]], ['sky ↓', P.sky[1]]];
document.getElementById('side').innerHTML = `
  <div><span class="tag" style="background:${P.primary}">시안 ${K.id}</span>${(K.keywords || []).map((k) => `<span class="tag">#${k}</span>`).join('')}</div>
  <h1>${K.name}</h1><div class="mood">${K.mood || ''}</div>
  <div class="sw">${sw.map(([n, c]) => `<div style="background:${c}">${n}<br>${c}</div>`).join('')}</div>
  <div class="ui"><div style="font-size:12px;opacity:.7">UI 미리보기</div>
    <div class="btn" style="background:${P.primary}">입장하기</div> <div class="btn" style="background:${P.accent};color:#222">👋 인사</div>
    <div style="margin-top:10px;display:inline-block;padding:4px 12px;border-radius:20px;background:${P.primary};font-weight:800;font-size:13px">여행자1234</div></div>
  <div class="pick">마음에 들면 Claude 에게 <code>시안 ${K.id}로 할게</code> 라고 말하세요.<br>색만 바꾸고 싶으면 <code>시안 ${K.id}에 하늘만 더 밝게</code> 처럼 말해도 돼요.</div>`;
// ---- 3D 미리보기 (천천히 돌아감) ----
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.outputColorSpace = THREE.SRGBColorSpace;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
const sky = document.createElement('canvas'); sky.width = 2; sky.height = 256; { const g = sky.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, P.sky[0]); gr.addColorStop(1, P.sky[1]); g.fillStyle = gr; g.fillRect(0, 0, 2, 256); }
const st = new THREE.CanvasTexture(sky); st.colorSpace = THREE.SRGBColorSpace; scene.background = st;
scene.fog = new THREE.Fog(C(P.fog || P.sky[1]), 40, 120);
scene.add(new THREE.HemisphereLight(C(K.light?.sky || '#fff'), C(K.light?.ground || '#888'), K.light?.ambient ?? 1.4));
const sun = new THREE.DirectionalLight(C(K.light?.sun || '#fff'), K.light?.intensity ?? 1.1); sun.position.set(20, 40, 15); scene.add(sun);
const lam = (h) => new THREE.MeshLambertMaterial({ color: C(h) }), glow = (h) => new THREE.MeshBasicMaterial({ color: C(h) });
const [W, D] = Z.size;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), lam(P.floor)); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const edge = new THREE.Mesh(new THREE.BoxGeometry(W + 1, 0.4, D + 1), lam(P.wall)); edge.position.y = -0.21; scene.add(edge);
function prop(p) {
  const g = new THREE.Group(); g.position.set(p.x, 0, p.z); g.rotation.y = ((p.rot || 0) * Math.PI) / 180;
  const add = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); g.add(o); return o; };
  if (p.kind === 'tree') { add(new THREE.CylinderGeometry(0.18, 0.25, 1.6, 8), lam(K.props?.trunk || '#8b6a4e'), 0, 0.8, 0); add(new THREE.IcosahedronGeometry(1.2, 0), lam(K.props?.leaf || '#5fbf86'), 0, 2.3, 0); }
  else if (p.kind === 'bench') { const m = lam(K.props?.wood || '#b98b5e'); add(new THREE.BoxGeometry(2, 0.1, 0.5), m, 0, 0.45, 0); add(new THREE.BoxGeometry(2, 0.5, 0.08), m, 0, 0.75, -0.22); }
  else if (p.kind === 'lamp') { add(new THREE.CylinderGeometry(0.06, 0.08, 3.2, 8), lam('#444'), 0, 1.6, 0); add(new THREE.SphereGeometry(0.28, 12, 10), glow(K.props?.light || '#fff3c4'), 0, 3.3, 0); const l = new THREE.PointLight(C(K.props?.light || '#fff3c4'), 6, 9); l.position.y = 3.2; g.add(l); }
  else if (p.kind === 'fountain') { add(new THREE.CylinderGeometry(2.4, 2.6, 0.6, 24), lam('#d8d8d8'), 0, 0.3, 0); add(new THREE.CylinderGeometry(2.1, 2.1, 0.05, 24), new THREE.MeshPhongMaterial({ color: C(K.props?.water || '#7cc6ff'), shininess: 90 }), 0, 0.6, 0); add(new THREE.CylinderGeometry(0.25, 0.35, 1.6, 12), lam('#e6e6e6'), 0, 1.2, 0); }
  else if (p.kind === 'flowers') { for (let k = 0; k < 14; k++) add(new THREE.SphereGeometry(0.12, 6, 5), glow([P.accent, P.primary, '#fff'][k % 3]), (Math.random() - 0.5) * 2.4, 0.15, (Math.random() - 0.5) * 2.4); }
  else if (p.kind === 'kiosk') { add(new THREE.BoxGeometry(2.4, 2.4, 1.8), lam(P.accent), 0, 1.2, 0); const r = add(new THREE.ConeGeometry(1.9, 1, 4), lam(P.primary), 0, 2.9, 0); r.rotation.y = Math.PI / 4; }
  else if (p.kind === 'rock') { const r = add(new THREE.DodecahedronGeometry(0.7, 0), lam('#9aa0a6'), 0, 0.4, 0); r.scale.y = 0.7; }
  else { const [w, h, d] = p.size || [1, 1, 1]; add(new THREE.BoxGeometry(w, h, d), lam(p.color || P.accent), 0, h / 2, 0); }
  scene.add(g);
}
(Z.props || []).forEach(prop);
for (const pt of Z.portals || []) {
  const g = new THREE.Group(); g.position.set(pt.x, 0, pt.z); g.rotation.y = Math.atan2(-pt.x, -pt.z);
  const f = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.16, 10, 32, Math.PI), lam(P.primary)); f.position.y = 1.3; g.add(f);
  for (const x of [-1.5, 1.5]) { const post = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 1.3, 10), lam(P.primary)); post.position.set(x, 0.65, 0); g.add(post); }
  const face = new THREE.Mesh(new THREE.PlaneGeometry(2.9, 2.6), new THREE.MeshBasicMaterial({ color: C(P.accent), transparent: true, opacity: 0.55, side: THREE.DoubleSide })); face.position.y = 1.3; g.add(face);
  scene.add(g);
}
// 아바타 (동글동글 마스코트 단순판) 몇 명
function blob(color, x, z, yaw) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = yaw;
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 14), lam(color)); body.position.y = 0.46; body.scale.set(1.05, 0.95, 0.95); g.add(body);
  for (const s of [-1, 1]) { const e = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.14, 4, 8), lam(color)); e.position.set(s * 0.22, 0.86, 0); e.rotation.z = -s * 0.35; g.add(e);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), glow('#2a2320')); eye.position.set(s * 0.13, 0.55, 0.38); g.add(eye); }
  scene.add(g); return g;
}
blob(K.avatar?.me || '#fff3dc', 0, 6, Math.PI); blob('#ffd9e4', -2, 7.5, 2.6); blob('#d9ecff', 2.2, 7, -2.8);
function resize() { const r = view.getBoundingClientRect(); renderer.setSize(r.width, r.height); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let t = 0;
(function loop() { t += 0.0025; const R = Math.max(W, D) * 0.85; camera.position.set(Math.sin(t) * R, R * 0.55, Math.cos(t) * R); camera.lookAt(0, 0.5, 0); renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>
</body>
</html>
